<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PurPurVR Hub</title>
    <style>
        /* Forces the native Windows Snipping Tool precision crosshair everywhere universally */
        *, html, body, .bio-container, a, button, .btn-link {
            cursor: crosshair !important;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Smoothly moving animated neon-purple gradient background layout */
        body {
            background: linear-gradient(-45deg, #0e051a, #250b3e, #14042c, #040108);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Central Purple Glassmorphism Box */
        .bio-container {
            background: rgba(25, 10, 45, 0.55); /* Translucent midnight purple */
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(160, 80, 240, 0.3);
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            width: 90%;
            max-width: 420px;
            color: #ffffff;
            box-shadow: 0 10px 35px rgba(130, 40, 255, 0.35);
            z-index: 10;
        }

        /* Profile Picture Circular Frame Styling */
        .pfp-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 15px auto;
            display: block;
            border: 2.5px solid rgba(180, 100, 255, 0.8);
            box-shadow: 0 0 15px rgba(180, 100, 255, 0.6);
        }

        .bio-container h2 {
            margin-bottom: 5px;
            font-weight: 700;
            text-shadow: 0 0 15px rgba(180, 100, 255, 0.8);
        }

        .bio-container p {
            color: #e0d0f0;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        /* Interactive Purple Hyperlink Buttons */
        .btn-link {
            display: block;
            background: rgba(140, 60, 220, 0.15);
            color: #ffffff;
            text-decoration: none;
            padding: 14px;
            margin: 12px 0;
            border-radius: 10px;
            font-weight: 600;
            border: 1px solid rgba(180, 100, 255, 0.3);
            transition: all 0.3s ease;
        }

        .btn-link:hover {
            background: #a050f0;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(160, 80, 240, 0.6);
        }

        /* Highlighted/Glowing Download Button Variant for File Installers */
        .btn-download {
            border: 1px solid #a050f0;
            background: rgba(160, 80, 240, 0.25);
            box-shadow: 0 0 10px rgba(160, 80, 240, 0.4);
            font-weight: 700;
            letter-spacing: 1px;
        }
        
        .btn-download:hover {
            background: #a050f0;
            box-shadow: 0 0 20px rgba(160, 80, 240, 0.8);
        }
    </style>
</head>
<body>

    <!-- Central Main Info Link Hub Panel -->
    <div class="bio-container">
        <!-- Placeholder Profile Picture Circle Frame -->
        <img class="pfp-avatar" src="https://placeholder.com" alt="Profile Picture">
        <h2>@PurPurVR</h2>
        <p>VR Modding & Creations</p>
        
        <!-- Secure Multi-Installer Direct Download Triggers -->
        <a href="MoonlitV2.apk" download="MoonlitV2.apk" class="btn-link btn-download">Download MoonlitV2</a>
        <a href="OcularMigraine.apk" download="OcularMigraine.apk" class="btn-link btn-download">Download The Ocular Migraine</a>
        
        <!-- Social Media Redirection Links -->
        <a href="https://discord.gg" target="_blank" class="btn-link">EIC Modding Discord</a>
        <a href="https://youtube.com" target="_blank" class="btn-link">YouTube Channel</a>
    </div>

</body>
</html>
