<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PurPurVR Hub</title>
    <style>
        /* Force-hide the normal system mouse pointer everywhere across the layout framework */
        *, html, body, .bio-container, a, button, .btn-link {
            cursor: none !important;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #000;
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Direct Hosted Mixkit Purple Electrical Lightning Shape Loop */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            filter: brightness(0.4) contrast(1.2); 
        }

        /* Central Purple Glassmorphism Box */
        .bio-container {
            background: rgba(25, 10, 45, 0.55); /* Translucent midnight purple */
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(160, 80, 240, 0.3);
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            width: 90%;
            max-width: 420px;
            color: #ffffff;
            box-shadow: 0 10px 35px rgba(130, 40, 255, 0.35);
            z-index: 10;
        }

        /* Profile Picture Circular Frame Styling */
        .pfp-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 15px auto;
            display: block;
            border: 2.5px solid rgba(180, 100, 255, 0.8);
            box-shadow: 0 0 15px rgba(180, 100, 255, 0.6);
        }

        .bio-container h2 {
            margin-bottom: 5px;
            font-weight: 700;
            text-shadow: 0 0 15px rgba(180, 100, 255, 0.8);
        }

        .bio-container p {
            color: #e0d0f0;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        /* Interactive Purple Hyperlink Buttons */
        .btn-link {
            display: block;
            background: rgba(140, 60, 220, 0.15);
            color: #ffffff;
            text-decoration: none;
            padding: 14px;
            margin: 12px 0;
            border-radius: 10px;
            font-weight: 600;
            border: 1px solid rgba(180, 100, 255, 0.3);
            transition: all 0.3s ease;
        }

        .btn-link:hover {
            background: #a050f0;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(160, 80, 240, 0.6);
        }

        /* Highlighted/Glowing Download Button Variant for File Installers */
        .btn-download {
            border: 1px solid #a050f0;
            background: rgba(160, 80, 240, 0.25);
            box-shadow: 0 0 10px rgba(160, 80, 240, 0.4);
            font-weight: 700;
            letter-spacing: 1px;
        }
        
        .btn-download:hover {
            background: #a050f0;
            box-shadow: 0 0 20px rgba(160, 80, 240, 0.8);
        }

        /* Custom Snipping Tool Style Crosshair Coordinate Pointer Object */
        #custom-cursor {
            position: fixed;
            width: 32px;
            height: 32px;
            pointer-events: none;
            z-index: 99999999;
            transform: translate(-50%, -50%);
            display: block;
        }
    </style>
</head>
<body>

    <!-- Direct Hosted Mixkit Purple Electrical Lightning Shape Loop -->
    <video class="video-background" autoplay loop muted playsinline>
        <source src="https://drive.google.com/file/d/1IuaRdxrtwM-cVkPZ8qOPEuYT3YTFkIrC/view?usp=drive_link" type="video/mp4">
    </video>

    <!-- Custom Periwinkle Sniper Crosshair Target Cursor -->
    <div id="custom-cursor">
        <svg xmlns="http://w3.org" width="32" height="32" viewBox="0 0 32 32">
            <line x1="16" y1="2" x2="16" y2="10" stroke="#CCCCFF" stroke-width="2"/>
            <line x1="16" y1="22" x2="16" y2="30" stroke="#CCCCFF" stroke-width="2"/>
            <line x1="2" y1="16" x2="10" y2="16" stroke="#CCCCFF" stroke-width="2"/>
            <line x1="21" y1="16" x2="29" y2="16" stroke="#CCCCFF" stroke-width="2"/>
        </svg>
    </div>

    <!-- Central Main Info Link Hub Panel -->
    <div class="bio-container">
        <!-- Change the link inside src="..." to your own image link -->
        <img class="pfp-avatar" src="https://https://share.google/3qS7aCd11iF3BEYjX" alt="Profile Picture">
        <h2>@PurPurVR</h2>
        <p>VR Modding & Creations</p>
        
        <!-- Converted Google Drive Auto-Download File Buttons -->
        <a href="https://google.com" class="btn-link btn-download">Download MoonlitV2</a>
        <a href="https://google.com" class="btn-link btn-download">Download The Ocular Migraine</a>
        
        <!-- Social Media Redirection Links -->
        <a href="https://discord.gg" target="_blank" class="btn-link">EIC Modding Discord</a>
        <a href="https://youtube.com" target="_blank" class="btn-link">YouTube Channel</a>
    </div>

    <!-- Layout Function Scripts -->
    <script>
        // Custom Precision Mouse Coordinate Engine Tracking Rules
        const customCursor = document.getElementById('custom-cursor');
        window.addEventListener('mousemove', (e) => {
            customCursor.style.left = e.clientX + 'px';
            customCursor.style.top = e.clientY + 'px';
        });
    </script>

</body>
</html>
