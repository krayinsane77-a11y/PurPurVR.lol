<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PurPurVR Hub</title>
    <style>
        /* Hide the default system mouse pointer completely across the site */
        *, html, body, .bio-container, a, button, .btn-link {
            cursor: none !important;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #000;
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Background video layer */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            filter: brightness(0.4);
        }

        /* Central Purple Glassmorphism Box */
        .bio-container {
            background: rgba(45, 15, 75, 0.5);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(160, 80, 240, 0.3);
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            width: 90%;
            max-width: 420px;
            color: #ffffff;
            box-shadow: 0 10px 30px rgba(75, 0, 130, 0.4);
            z-index: 10;
        }

        .bio-container h2 {
            margin-bottom: 5px;
            font-weight: 700;
            text-shadow: 0 0 15px rgba(180, 100, 255, 0.8);
        }

        .bio-container p {
            color: #e0d0f0;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        /* Interactive Purple Buttons */
        .btn-link {
            display: block;
            background: rgba(140, 60, 220, 0.15);
            color: #ffffff;
            text-decoration: none;
            padding: 14px;
            margin: 12px 0;
            border-radius: 10px;
            font-weight: 600;
            border: 1px solid rgba(180, 100, 255, 0.3);
            transition: all 0.3s ease;
        }

        .btn-link:hover {
            background: #a050f0;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(160, 80, 240, 0.6);
        }

        /* This is our new physical cursor layer */
        #custom-cursor {
            position: fixed;
            width: 32px;
            height: 32px;
            pointer-events: none;
            z-index: 999999;
            transform: translate(-50%, -50%);
            display: block;
        }
    </style>
</head>
<body>

    <!-- Looping Background Video -->
    <video class="video-background" autoplay loop muted playsinline>
        <source src="https://mixkit.co" type="video/mp4">
    </video>

    <!-- The actual custom crosshair element -->
    <div id="custom-cursor">
        <svg xmlns="http://w3.org" width="32" height="32" viewBox="0 0 32 32">
            <line x1="16" y1="3" x2="16" y2="11" stroke="#CCCCFF" stroke-width="2"/>
            <line x1="16" y1="21" x2="16" y2="29" stroke="#CCCCFF" stroke-width="2"/>
            <line x1="3" y1="16" x2="11" y2="16" stroke="#CCCCFF" stroke-width="2"/>
            <line x1="21" y1="16" x2="29" y2="16" stroke="#CCCCFF" stroke-width="2"/>
        </svg>
    </div>

    <!-- Center Card Panel -->
    <div class="bio-container">
        <h2>@PurPurVR</h2>
        <p>VR Modding & Creations</p>
        <a href="https://discord.gg" target="_blank" class="btn-link">EIC Modding Discord</a>
        <a href="https://youtube.com" target="_blank" class="btn-link">YouTube Channel</a>
    </div>

    <!-- Quick tracking script to glue the crosshair to your mouse -->
    <script>
        const customCursor = document.getElementById('custom-cursor');
        
        window.addEventListener('mousemove', (e) => {
            customCursor.style.left = e.clientX + 'px';
            customCursor.style.top = e.clientY + 'px';
        });
    </script>

</body>
</html>
