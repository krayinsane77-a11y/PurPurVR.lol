<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PurPurVR Hub</title>
    <style>
        /* Hide default system mouse cursor completely across the website layout */
        *, html, body, .bio-container, a, button, .btn-link {
            cursor: none !important;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #000;
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Background video layer */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            filter: brightness(0.4);
        }

        /* Central Purple Glassmorphism Box */
        .bio-container {
            background: rgba(45, 15, 75, 0.5);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(160, 80, 240, 0.3);
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            width: 90%;
            max-width: 420px;
            color: #ffffff;
            box-shadow: 0 10px 30px rgba(75, 0, 130, 0.4);
            z-index: 10;
        }

        .bio-container h2 {
            margin-bottom: 5px;
            font-weight: 700;
            text-shadow: 0 0 15px rgba(180, 100, 255, 0.8);
        }

        .bio-container p {
            color: #e0d0f0;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        /* Interactive Purple Buttons */
        .btn-link {
            display: block;
            background: rgba(140, 60, 220, 0.15);
            color: #ffffff;
            text-decoration: none;
            padding: 14px;
            margin: 12px 0;
            border-radius: 10px;
            font-weight: 600;
            border: 1px solid rgba(180, 100, 255, 0.3);
            transition: all 0.3s ease;
        }

        .btn-link:hover {
            background: #a050f0;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(160, 80, 240, 0.6);
        }

        /* Particle Trail Dot Elements Styling */
        .trail-dot {
            position: fixed;
            width: 6px;
            height: 6px;
            background-color: #CCCCFF; /* Periwinkle Color */
            border-radius: 50%;
            pointer-events: none;
            z-index: 999999;
            transform: translate(-50%, -50%);
            opacity: 0;
            box-shadow: 0 0 8px #CCCCFF, 0 0 15px #9999FF; /* Glowing look */
        }
    </style>
</head>
<body>

    <!-- Looping Background Video -->
    <video class="video-background" autoplay loop muted playsinline>
        <source src="https://mixkit.co" type="video/mp4">
    </video>

    <!-- Center Card Panel -->
    <div class="bio-container">
        <h2>@PurPurVR</h2>
        <p>VR Modding & Creations</p>
        <a href="https://discord.gg" target="_blank" class="btn-link">EIC Modding Discord</a>
        <a href="https://youtube.com" target="_blank" class="btn-link">YouTube Channel</a>
    </div>

    <!-- Smooth Mouse Trail Tracking Engine -->
    <script>
        const dots = [];
        const maxDots = 10; // Number of glowing tracking elements inside the tail

        // Generate tracking dot layers
        for (let i = 0; i < maxDots; i++) {
            const dot = document.createElement('div');
            dot.className = 'trail-dot';
            document.body.appendChild(dot);
            dots.push({ element: dot, x: 0, y: 0 });
        }

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        // Framerate math layout engine that handles smooth cursor trailing inertia
        function animate() {
            let x = mouseX;
            let y = mouseY;

            dots.forEach((dot, index) => {
                const nextDot = dots[index + 1] || dots[0];
                
                dot.element.style.left = x + 'px';
                dot.element.style.top = y + 'px';
                
                // Scale dots down so the trail gets thinner at the tail end
                const scale = (maxDots - index) / maxDots;
                dot.element.style.transform = `translate(-50%, -50%) scale(${scale})`;
                dot.element.style.opacity = scale * 0.9;

                // Inertia lag math to form the smooth follow trail link
                x += (nextDot.x - x) * 0.25;
                y += (nextDot.y - y) * 0.25;
                
                dot.x = x;
                dot.y = y;
            });

            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
